[pytest]
# Pytest配置文件

# 测试目录
testpaths = tests

# Python文件模式
python_files = test_*.py

# Python类模式
python_classes = Test*

# Python函数模式
python_functions = test_*

# 输出选项
addopts = 
    -v
    --tb=short
    --strict-markers

# 标记
markers =
    unit: 单元测试
    property: 基于属性的测试
    integration: 集成测试
    ui: UI测试

# Hypothesis配置
[hypothesis]
max_examples = 100
