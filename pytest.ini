[pytest]
# Pytest配置文件

# 测试目录
testpaths = tests

# Python文件模式
python_files = test_*.py

# Python类模式
python_classes = Test*

# Python函数模式
python_functions = test_*

# 输出选项
# -p no:asyncio: 项目依赖amqtt会引入pytest-asyncio插件，
#                与本项目的同步测试收集方式冲突，显式禁用
addopts = 
    -v
    --tb=short
    --strict-markers
    -p no:asyncio

# 强制pytest-qt使用PyQt6绑定。
# 若本机同时安装了PySide6，pytest-qt默认可能加载PySide6，
# 与项目代码导入的PyQt6在同一进程混载会造成Qt DLL冲突，测试全部崩溃
qt_api = pyqt6

# 标记
markers =
    unit: 单元测试
    property: 基于属性的测试
    integration: 集成测试
    ui: UI测试

# Hypothesis配置
[hypothesis]
max_examples = 100
